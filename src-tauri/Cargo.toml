[package]
name = "myvault"
version = "0.1.0"
description = "MyVault product shell"
authors = ["MyVault contributors"]
edition = "2021"

[lib]
name = "myvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keepass = { version = "=0.13.19", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
sha2 = "0.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
